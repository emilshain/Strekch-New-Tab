<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="date-card" id="date-card">
            <div class="day-section" id="day-section">
                <span id="day-text"></span>
            </div>
            <div class="date-section" id="date-section">
                <span id="date-text-new"></span>
            </div>
        </div>
        <div class="greeting-card" id="greeting-card">
            <div class="temperature-section" id="temp-section">
                <div class="temperature" id="temperature-text">--°C</div>
            </div>
        </div>
        <div class="clock-card" id="clock-card">
            <div class="clock-section" id="clock-section">
                <div id="clock" class="clock">
                    <span id="clock-text">00:00</span>
                </div>
            </div>
        </div>
    </div>



    <div id="shortcuts-legend" class="shortcuts-legend" aria-hidden="true">
        <div class="legend-title">Keyboard Shortcuts</div>
        <div class="legend-grid">
            <div class="legend-item"><span class="key">C + Enter</span> ChatGPT</div>
            <div class="legend-item"><span class="key">A + Enter</span> Claude</div>
            <div class="legend-item"><span class="key">G + Enter</span> Gemini</div>
            <div class="legend-item"><span class="key">P + Enter</span> Perplexity</div>
            <div class="legend-item"><span class="key">Y + Enter</span> YouTube</div>
            <div class="legend-item"><span class="key">M + Enter</span> Maps</div>
            <div class="legend-item"><span class="key">L + Enter</span> LinkedIn</div>
            <div class="legend-item"><span class="key">I + Enter</span> Instagram</div>
            <div class="legend-item"><span class="key">?</span> Focus-free Help</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
